<!doctype html>
<html lang="en" class="dark" data-theme="orbit">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal workspace for tasks, projects and notes." />
    <title>Orbit — Personal Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('orbit.state.v1')
        var value = stored ? JSON.parse(stored).theme : 'orbit'
        if (value === 'dark') value = 'orbit'
        if (value === 'light') value = 'paper'
        if (value !== 'orbit' && value !== 'paper' && value !== 'graphite') value = 'orbit'
        document.documentElement.dataset.theme = value
        document.documentElement.classList.toggle('dark', value !== 'paper')
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
