name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            script: build:win
            args: --bundles nsis
          - label: Linux x64
            platform: ubuntu-22.04
            script: build:linux
            args: --bundles deb,appimage
          - label: macOS Apple Silicon
            platform: macos-14
            script: build:mac
            args: --bundles dmg,app
          - label: macOS Intel
            platform: macos-15-intel
            script: build:mac
            args: --bundles dmg,app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Axiom Core ${{ github.ref_name }}"
          releaseBody: |
            Installers for Windows, Linux and macOS are attached below.
            Unsigned builds: your OS may ask you to confirm before opening them.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm run ${{ matrix.script }}

      - name: Upload build output
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: axiom-core-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
